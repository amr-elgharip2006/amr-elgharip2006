      <rect x="16" y="19" width="12" height="12" rx="3" fill="#2563eb"/>
      <text x="42" y="31" fill="#0b0b0f">BUILD</text>
      <rect x="40" y="62" width="230" height="50" rx="12" fill="#f4f4f5" stroke="#0b0b0f14"/>
      <rect x="56" y="81" width="12" height="12" rx="3" fill="#3b82f6"/>
      <text x="82" y="93" fill="#0b0b0f">AUTOMATE</text>
      <rect x="0" y="124" width="230" height="50" rx="12" fill="#f4f4f5" stroke="#0b0b0f14"/>
      <rect x="16" y="143" width="12" height="12" rx="3" fill="#06b6d4"/>
      <text x="42" y="155" fill="#0b0b0f">SCALE</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#0b0b0f14" stroke-width="2"/>

