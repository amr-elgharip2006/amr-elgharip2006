name: Profile assets

# Regenerates the stats cards and the contribution snake into the `output`
# branch, which the README links to.
on:
  schedule:
    - cron: "17 3 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-assets.yml", "scripts/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats and languages cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: dist
        run: python3 scripts/stats.py

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
